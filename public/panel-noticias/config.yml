backend:
  name: github
  repo: cuenta-vueltas77/cuentavueltas-v2
  branch: main

media_folder: "public/uploads" 
public_folder: "/uploads"      

collections:
  - name: "noticias"
    label: "Noticias"
    folder: "src/content/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Bajada / Resumen", name: "bajada", widget: "text" }
      
      # 👇 ACÁ ESTÁ EL CAMBIO PARA SVELTIA (datetime sin horas) 👇
      - { label: "Fecha", name: "fecha", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      
      - { label: "Autor", name: "autor", widget: "string", default: "Redacción CV77" }
      - { label: "Categorías", name: "categorias", widget: "select", multiple: true, options: ["Automovilismo", "TC Austral", "TP 1100", "R12", "TP Gol", "General"], default: ["Automovilismo"] }
      - { label: "Tipo", name: "tipo", widget: "string", default: "Noticia" }
      - { label: "Imagen Principal", name: "imagen", widget: "image" }
      - { label: "Galería de Fotos (Opcional)", name: "galeria", widget: "list", field: { label: "Foto", name: "foto", widget: "image" }, required: false }
      - { label: "Audio de la nota (Opcional)", name: "audio", widget: "file", required: false }
      - { label: "Cuerpo de la Noticia", name: "body", widget: "markdown" }