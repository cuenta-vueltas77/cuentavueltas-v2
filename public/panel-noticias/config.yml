backend:
  name: github
  repo: cuenta-vueltas77/cuentavueltas-v2 
  branch: main

media_folder: "public/uploads" 
public_folder: "/uploads"      

collections:
  - name: "noticias"
    label: "Noticias"
    folder: "src/content/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Bajada / Resumen", name: "bajada", widget: "text", required: false }
      - { label: "Fecha", name: "fecha", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Categoría", name: "categoria", widget: "select", options: ["Automovilismo", "TC Austral", "TP 1100", "R12", "TP Gol", "General"], default: "Automovilismo" }
      - { label: "Imagen Principal", name: "imagen", widget: "image", required: false }
      - { label: "Galería de Fotos (Opcional)", name: "galeria", widget: "list", field: { label: "Foto", name: "foto", widget: "image" }, required: false }
      - { label: "Cuerpo de la Noticia", name: "body", widget: "markdown" }